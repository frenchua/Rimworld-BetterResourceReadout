# Builds the mod and updates its existing Steam Workshop item.
#
# Requires two repository secrets:
#   STEAM_USERNAME   - Steam account that owns the Workshop item
#   STEAM_CONFIG_VDF - contents of SteamCMD's config/config.vdf after a local
#                      `steamcmd +login <user>` that cleared Steam Guard
# See README.md ("Releasing") for how to produce them.
name: Steam Workshop

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      changeNote:
        description: Workshop changenote
        required: false
        type: string

concurrency:
  group: steam-workshop
  cancel-in-progress: false

env:
  STEAM_APP_ID: '294100'

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # Builds both target frameworks. 1.6/net472 uses Krafs.Rimworld.Ref plus the
      # .NET Framework reference assemblies; 1.7/net10.0 falls back to the prerelease
      # ref package because there is no RimWorld install on the runner.
      - name: Build
        run: dotnet build -c Release

      - name: Stage mod folder
        id: stage
        run: |
          set -euo pipefail
          asm=RimWorld.RememberResourceReadout.dll

          mkdir -p staging/About staging/1.6/Assemblies staging/1.7/Assemblies
          cp About/About.xml About/Preview.png About/PublishedFileId.txt staging/About/
          cp 1.6/Assemblies/*.dll staging/1.6/Assemblies/
          cp 1.7/Assemblies/*.dll staging/1.7/Assemblies/
          cp README.md staging/
          [ -f LICENSE ] && cp LICENSE staging/ || true

          # A missing DLL here would publish a broken mod to every subscriber.
          for v in 1.6 1.7; do
            test -f "staging/$v/Assemblies/$asm" || {
              echo "::error::$v/Assemblies/$asm was not built"; exit 1; }
          done

          echo "Staged contents:"
          find staging -type f | sort

          id="$(tr -d '[:space:]' < About/PublishedFileId.txt)"
          case "$id" in
            ''|*[!0-9]*) echo "::error::About/PublishedFileId.txt is not a numeric id"; exit 1 ;;
          esac
          echo "publishedFileId=$id" >> "$GITHUB_OUTPUT"

      # SteamCMD runs natively rather than through a containerized action. Docker 29.4.2
      # (shipped on the ubuntu-26.04 runner image) denies socketcall(2) in its default
      # seccomp profile, and SteamCMD is a 32-bit binary whose every socket() call goes
      # through socketcall, so inside a container it dies with "Steamcmd needs to be
      # online to update". Running on the host avoids container seccomp entirely, which
      # keeps this job working on ubuntu-latest regardless of the image's Docker version.
      # See steamcmd/docker#93 and game-ci/steam-deploy#98.
      - name: Install SteamCMD
        run: |
          set -euo pipefail

          # Valve ships SteamCMD as a 32-bit x86 binary. The GitHub runner images carry
          # the 32-bit runtime already; installing it explicitly means an image that ever
          # drops i386 fails here with a clear message instead of deep inside SteamCMD.
          if ! dpkg -s lib32gcc-s1 >/dev/null 2>&1; then
            sudo dpkg --add-architecture i386
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends lib32gcc-s1
          fi

          mkdir -p "$RUNNER_TEMP/steamcmd"
          curl -sSfL https://steamcdn-a.akamaihd.net/client/installer/steamcmd_linux.tar.gz \
            | tar --no-same-owner -xzf - -C "$RUNNER_TEMP/steamcmd"

          # The first run bootstraps and self-updates, and can exit non-zero even when it
          # succeeded; only a second consecutive failure is treated as fatal.
          "$RUNNER_TEMP/steamcmd/steamcmd.sh" +quit \
            || "$RUNNER_TEMP/steamcmd/steamcmd.sh" +quit

      - name: Upload to Steam Workshop
        env:
          STEAM_USERNAME: ${{ secrets.STEAM_USERNAME }}
          STEAM_CONFIG_VDF: ${{ secrets.STEAM_CONFIG_VDF }}
          PUBLISHED_FILE_ID: ${{ steps.stage.outputs.publishedFileId }}
          CHANGE_NOTE: ${{ inputs.changeNote || github.event.head_commit.message }}
        run: |
          set -euo pipefail
          steamcmd="$RUNNER_TEMP/steamcmd/steamcmd.sh"

          test -n "${STEAM_USERNAME:-}" || {
            echo "::error::STEAM_USERNAME secret is not set"; exit 1; }
          test -n "${STEAM_CONFIG_VDF:-}" || {
            echo "::error::STEAM_CONFIG_VDF secret is not set"; exit 1; }

          # Restore the SteamCMD login session so CI never handles the password.
          install -d -m 700 "$HOME/Steam/config"
          printf '%s' "$STEAM_CONFIG_VDF" > "$HOME/Steam/config/config.vdf"
          chmod 600 "$HOME/Steam/config/config.vdf"

          # Confirm the session still works before touching the Workshop item, so an
          # expired Steam Guard session reads as a login error rather than a failed upload.
          "$steamcmd" +login "$STEAM_USERNAME" +quit > "$RUNNER_TEMP/login.log" 2>&1 || true
          cat "$RUNNER_TEMP/login.log"
          if grep -qiE "FAILED login|Login Failure|Invalid Password" "$RUNNER_TEMP/login.log"; then
            echo "::error::SteamCMD login failed - the STEAM_CONFIG_VDF session has most likely expired. Regenerate it as described in README.md."
            exit 1
          fi

          # VDF strings are double-quoted and cannot span lines, so escape backslashes
          # and quotes, then fold a multi-line commit message into literal \n escapes.
          # The replacements come from variables because bash strips backslashes out of
          # a literal replacement string.
          bs='\'
          note=${CHANGE_NOTE//"$bs"/"$bs$bs"}
          note=${note//'"'/"$bs\""}
          note=${note//$'\r'/}
          note=${note//$'\n'/"${bs}n"}

          # workshop_build_item needs an absolute content path.
          manifest="$RUNNER_TEMP/manifest.vdf"
          printf '"workshopitem"\n{\n\t"appid" "%s"\n\t"publishedfileid" "%s"\n\t"contentfolder" "%s"\n\t"changenote" "%s"\n}\n' \
            "$STEAM_APP_ID" "$PUBLISHED_FILE_ID" "$GITHUB_WORKSPACE/staging" "$note" > "$manifest"
          echo "Generated manifest:"
          cat "$manifest"

          log="$RUNNER_TEMP/upload.log"
          set +e
          "$steamcmd" +login "$STEAM_USERNAME" +workshop_build_item "$manifest" +quit 2>&1 | tee "$log"
          rc=${PIPESTATUS[0]}
          set -e

          # SteamCMD's exit code alone is not trustworthy, so require a success line too -
          # a silent no-op would otherwise look like a published release.
          if [ "$rc" -ne 0 ] || ! grep -qiE "Success|update successful" "$log"; then
            echo "::error::Workshop upload failed (steamcmd exit $rc)"
            for f in "$HOME/Steam/logs"/*.txt; do
              [ -f "$f" ] || continue
              echo "----- $f"
              cat "$f"
            done
            exit 1
          fi
